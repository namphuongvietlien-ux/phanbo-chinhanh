async function dec(pw){var c=crypto.subtle,e=new TextEncoder();var km=await c.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);var k=await c.deriveKey({name:'PBKDF2',salt:u(ENC.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await c.decrypt({name:'AES-GCM',iv:u(ENC.i)},k,u(ENC.c)))}

 document.getElementById('q').oninput=show;
 function m(r){var q=document.getElementById('q').value.toLowerCase();return !q||(r.join(' ')).toLowerCase().indexOf(q)>=0}
 function show(){var v=document.getElementById('v'),x;
  if(cur==='s'){x='<div class="muted">Đỏ: hết hàng · Cam: gấp (&lt;7 ngày) · Vàng: cần bổ sung (&lt;14 ngày). Bán/Nhập '+D.weeks+' tuần gần nhất.</div><div class="tbl"><table><tr><th>Mức</th><th>Nguồn</th><th>Lệnh</th><th>Mã</th><th>Tên hàng</th><th>ĐVT</th><th>Tồn</th><th>Bán</th><th>Nhập</th><th>BQ/tuần</th><th>Đủ bán (ngày)</th><th>Cần</th><th>Phân bổ</th></tr>'+D.sug.filter(m).map(function(s){return '<tr class="'+(s[0]==='Hết hàng'?'het':s[0]==='Gấp'?'gap':'can')+'"><td>'+s[0]+'</td><td class="neg">'+(s[13]?'thiếu':'')+'</td><td>'+s[1]+'</td><td>'+esc(s[2])+'</td><td class="t">'+esc(s[3])+'</td><td>'+esc(s[4])+'</td><td class="n">'+f(s[5])+'</td><td class="n">'+f(s[6])+'</td><td class="n">'+f(s[7])+'</td><td class="n">'+f(s[8])+'</td><td class="n">'+f(s[9])+'</td><td class="n">'+f(s[10])+'</td><td class="n"><b>'+f(s[12])+'</b></td></tr>'}).join('')+'</table></div>'}
  else if(cur==='g'){x='<div class="muted">Sắp xếp theo chênh lệch bán − nhập trong '+D.weeks+' tuần (lớn nhất trước).</div><div class="tbl"><table><tr><th>Mã</th><th>Tên hàng</th><th>ĐVT</th><th>Bán (toàn kỳ)</th><th>Nhập (toàn kỳ)</th><th>Bán '+D.weeks+'t</th><th>Nhập '+D.weeks+'t</th><th>Chênh '+D.weeks+'t</th><th>Tồn</th><th>BQ/tuần</th></tr>'+D.gap.filter(m).map(function(g){var d=g[5]-g[6];return '<tr><td>'+esc(g[0])+'</td><td class="t">'+esc(g[1])+'</td><td>'+esc(g[2])+'</td><td class="n">'+f(g[3])+'</td><td class="n">'+f(g[4])+'</td><td class="n">'+f(g[5])+'</td><td class="n">'+f(g[6])+'</td><td class="n '+(d>0?'neg':'')+'">'+f(d)+'</td><td class="n '+(g[7]<=0?'neg':'')+'">'+f(g[7])+'</td><td class="n">'+f(g[8])+'</td></tr>'}).join('')+'</table></div>'}
  else{var W=Math.max(320,D.wk.length*34),H=170,mx=Math.max.apply(null,D.wk.map(function(o){return Math.max(o[1],o[2])}).concat([1])),md=Math.max.apply(null,D.wk.map(function(o){return o[3]}).concat([1])),bw=(W-20)/D.wk.length,p=[];
   x='<div class="muted">Xanh: SL bán · Cam: SL nhập · Đường xanh lá: doanh thu</div><div style="overflow:auto"><svg width="'+W+'" height="'+(H+20)+'">';D.wk.forEach(function(o,i){var X=10+i*bw,a=o[1]/mx*H,b=o[2]/mx*H;x+='<rect x="'+(X+1)+'" y="'+(H-a)+'" width="'+(bw/2-2)+'" height="'+a+'" fill="#3b7dd8"/><rect x="'+(X+bw/2)+'" y="'+(H-b)+'" width="'+(bw/2-2)+'" height="'+b+'" fill="#f39c33"/><text x="'+X+'" y="'+(H+14)+'" font-size="9">'+o[0].slice(8,10)+'/'+o[0].slice(5,7)+'</text>';p.push((X+bw/2)+','+(H-o[3]/md*H))});
   x+='<polyline points="'+p.join(' ')+'" fill="none" stroke="#2a9d5c" stroke-width="2"/></svg></div><div class="tbl"><table><tr><th>Tuần</th><th>SL bán</th><th>SL nhập</th><th>Chênh</th><th>Doanh thu</th><th>Số đơn</th></tr>'+D.wk.map(function(o){return '<tr><td>'+o[0]+'</td><td class="n">'+f(o[1])+'</td><td class="n">'+f(o[2])+'</td><td class="n '+(o[1]>o[2]?'neg':'')+'">'+f(o[1]-o[2])+'</td><td class="n">'+f(o[3])+'</td><td class="n">'+f(o[4])+'</td></tr>'}).join('')+'</table></div>'}
  v.innerHTML=x;var T=v.querySelector('.tbl table');if(T&&window.TF)TF.enhance(T,'v'+cur,{types:cur==='s'?{0:'set',1:'set',2:'set',3:'text',4:'text',5:'set'}:cur==='g'?{0:'text',1:'text',2:'set'}:{0:'text'}})}
 show()}
</script></body></html>
